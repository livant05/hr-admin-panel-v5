name: rrhh-go

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rrhh_go
      POSTGRES_USER: rrhh_go
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rrhh_go_dev}
    volumes:
      - rrhh_go_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrhh_go -d rrhh_go"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rrhh_go_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_URL: postgres://rrhh_go:${POSTGRES_PASSWORD:-rrhh_go_dev}@postgres:5432/rrhh_go?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev_change_me_in_prod}
    networks:
      - rrhh_go_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8100:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../hr_admin_panel.html:/usr/share/nginx/html/hr_admin_panel.html:ro
      - ../assets:/usr/share/nginx/html/assets:ro
      - ../css:/usr/share/nginx/html/css:ro
    networks:
      - rrhh_go_net

networks:
  rrhh_go_net:
    driver: bridge

volumes:
  rrhh_go_postgres_data:
