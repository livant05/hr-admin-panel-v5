name: rrhh-go

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rrhh_go
      POSTGRES_USER: rrhh_go
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rrhh_go_dev}
    volumes:
      - rrhh_go_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrhh_go -d rrhh_go"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rrhh_go_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_URL: postgres://rrhh_go:${POSTGRES_PASSWORD:-rrhh_go_dev}@postgres:5432/rrhh_go?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev_change_me_in_prod}
      AUTH_RATE_PER_MIN: ${AUTH_RATE_PER_MIN:-10}
      AUTH_ATTEMPT_RATE_PER_MIN: ${AUTH_ATTEMPT_RATE_PER_MIN:-60}
      # PROVISIONAL until a real-device check (OPS-1).
      ADMS_RATE_PER_MIN: ${ADMS_RATE_PER_MIN:-600}
      # Only nginx reaches this service (no published port), so the only
      # trusted proxy is the compose network itself (subnet declared under
      # networks below; keep both in sync). Its X-Real-IP is believed when
      # keying the rate limiters; no other private range is.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.29.77.0/24}
    networks:
      - rrhh_go_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8100:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../hr_admin_panel.html:/usr/share/nginx/html/hr_admin_panel.html:ro
      - ../assets:/usr/share/nginx/html/assets:ro
      - ../css:/usr/share/nginx/html/css:ro
    networks:
      - rrhh_go_net

networks:
  rrhh_go_net:
    driver: bridge
    # Explicit subnet so the trusted proxy range above is deterministic. If it
    # collides with a network on your host, change it here AND in
    # TRUSTED_PROXY_CIDRS.
    ipam:
      config:
        - subnet: 172.29.77.0/24

volumes:
  rrhh_go_postgres_data:
