server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index hr_admin_panel.html;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ZKTeco ADMS device endpoints (PROVISIONAL wire format, gated by OPS-1).
    # Public by design: devices carry no JWT. client_max_body_size matches the
    # backend's own 2 MiB cap; X-Real-IP overwrites any client-sent value and is
    # what the backend's rate limiter keys on (when this proxy is trusted).
    location /iclock/ {
        client_max_body_size 2m;
        proxy_pass http://backend:8080/iclock/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /hr_admin_panel.html;
    }
}
