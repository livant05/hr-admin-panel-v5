version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "../../migrations"
    gen:
      go:
        package: "db"
        out: "generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          # The override above matches NOT NULL columns only; nullable JSONB
          # (evaluations.scores, surveys.questions, ...) needs its own entry
          # or sqlc emits []byte, which encoding/json marshals as base64.
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
            nullable: true
